name: CI

on:
  push:
  pull_request:

# The job needs no write access to the repository.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      # Fetch the project so the hooks have files to check.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Python and uv run the project's tools and tests. Pin each
      # third-party action to an exact release tag; Dependabot updates them.
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10.3.3

      # The hooks need pre-commit; install it as a uv tool, as on a
      # developer machine.
      - run: uv tool install pre-commit

      # Install the project's locked dependencies.
      - run: uv sync
      # The checker runs `ruff` from PATH: use the project's locked one.
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # The project's own tests need no deploy key, so they run before it
      # is installed.
      - run: uv run pytest

      # The names hook lives in the private agents repository; pre-commit
      # clones it over SSH with a read-only deploy key. GitHub accepts a deploy
      # key on one repository only, so the key sits under its own host alias. It is installed
      # only now, after every third-party action and the tests have run, and
      # the host keys come from GitHub's API over TLS, not from a blind scan.
      - name: Install the agents deploy key
        env:
          AGENTS_DEPLOY_KEY: ${{ secrets.AGENTS_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$AGENTS_DEPLOY_KEY" > ~/.ssh/agents_deploy_key
          chmod 600 ~/.ssh/agents_deploy_key
          curl -fsSL https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' >> ~/.ssh/known_hosts
          {
            echo 'Host github-agents'
            echo '  HostName github.com'
            echo '  User git'
            echo '  IdentityFile ~/.ssh/agents_deploy_key'
            echo '  IdentitiesOnly yes'
            echo '  StrictHostKeyChecking yes'
          } >> ~/.ssh/config
          git config --global url."git@github-agents:bnomis/agents.git".insteadOf "git@github.com:bnomis/agents.git"

      # The audit hooks live in the private auditor repository, cloned the same
      # way with its own read-only deploy key under the github-auditor alias.
      - name: Install the auditor deploy key
        env:
          AUDITOR_DEPLOY_KEY: ${{ secrets.AUDITOR_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$AUDITOR_DEPLOY_KEY" > ~/.ssh/auditor_deploy_key
          chmod 600 ~/.ssh/auditor_deploy_key
          curl -fsSL https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' >> ~/.ssh/known_hosts
          {
            echo 'Host github-auditor'
            echo '  HostName github.com'
            echo '  User git'
            echo '  IdentityFile ~/.ssh/auditor_deploy_key'
            echo '  IdentitiesOnly yes'
            echo '  StrictHostKeyChecking yes'
          } >> ~/.ssh/config
          git config --global url."git@github-auditor:bnomis/auditor.git".insteadOf "git@github.com:bnomis/auditor.git"

      # The same commit-time checks, over the whole tree.
      - run: pre-commit run --all-files

      # The whole-tree audit, which the commit hook scopes to changed files.
      - name: Audit the whole tree
        run: pre-commit run auditme-all --hook-stage manual --all-files

      # Remove the key whether or not the checks passed.
      - name: Remove the agents deploy key
        if: always()
        run: rm -f ~/.ssh/agents_deploy_key
      - name: Remove the auditor deploy key
        if: always()
        run: rm -f ~/.ssh/auditor_deploy_key
