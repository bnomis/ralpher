repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.17.3
    hooks:
      # Run the linter.
      - id: ruff-check
      # Run the formatter.
      - id: ruff-format

  -   repo: https://github.com/shellcheck-py/shellcheck-py
      rev: v0.11.0.1-1
      hooks:
      - id: shellcheck
        args: ["--external-sources", "--source-path=SCRIPTDIR"]

  # The shared audit hooks, pinned to one commit of the checker.
  # Upgrade with: pre-commit autoupdate --repo git@github.com:bnomis/agents.git
  - repo: git@github.com:bnomis/agents.git
    rev: a98cb19de5abd1651d08c5ba2b7ce8edda91428b
    hooks:
      - id: auditme-changed
      - id: auditme-all
        stages: [manual, pre-push]
