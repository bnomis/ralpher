repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.17.3
    hooks:
      # Run the linter.
      - id: ruff-check
      # Run the formatter.
      - id: ruff-format

  -   repo: https://github.com/shellcheck-py/shellcheck-py
      rev: v0.11.0.1-1
      hooks:
      - id: shellcheck
        args: ["--external-sources", "--source-path=SCRIPTDIR"]

  # The shared audit hooks, pinned to one commit of the checker.
  # Upgrade with: pre-commit autoupdate --repo git@github.com:bnomis/agents.git
  - repo: git@github.com:bnomis/agents.git
    rev: 57057679d492175b546693840521e1a08970a2e5
    hooks:
      - id: auditme-changed
      - id: auditme-all
        stages: [manual, pre-push]
      # ralpher serves every project, so nothing here names one (AGENTS.md).
      - id: no-project-names
        args: ["--allow=ralpher", "--allow=ralphlib"]
